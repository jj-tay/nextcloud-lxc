---
# Idempotent install/verify path. Never touches upgrade logic — see upgrade.yml.

- name: Force www-data GID to {{ nextcloud_www_data_gid }}
  ansible.builtin.group:
    name: www-data
    gid: "{{ nextcloud_www_data_gid }}"
    system: true
    state: present

- name: Force www-data UID to {{ nextcloud_www_data_uid }}
  ansible.builtin.user:
    name: www-data
    uid: "{{ nextcloud_www_data_uid }}"
    group: www-data
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Configure the LXC's vmbr1 storage NIC
  ansible.builtin.import_tasks: network.yml

# Restarts the LXC once, the first time only (idmap needs a stopped CT).
- name: Map www-data's UID/GID 1:1 between the Proxmox host and the LXC
  ansible.builtin.import_tasks: host_idmap.yml

- name: Give the Proxmox host its vmbr1 IP and wait for TrueNAS NFS
  ansible.builtin.import_tasks: host_network.yml

# Must stay before occ maintenance:install (--data-dir) further down.
- name: Mount NFS on the Proxmox host and bind-mount it into the LXC
  ansible.builtin.import_tasks: host_nfs.yml

# A bind mount keeps the source's fstype, so this sees nfs/nfs4 inside the
# LXC only if the host mount was live when the container started.
- name: Verify the data directory is actually an NFS mount
  ansible.builtin.command: findmnt --target {{ nextcloud_data_mount }} --output FSTYPE --noheadings
  register: nextcloud_data_fstype
  changed_when: false

- name: Fail loudly if the data directory is not NFS-backed
  ansible.builtin.assert:
    that:
      - "'nfs' in nextcloud_data_fstype.stdout"
    fail_msg: >-
      {{ nextcloud_data_mount }} is not an NFS mount (found
      '{{ nextcloud_data_fstype.stdout }}'). Refusing to continue — Nextcloud
      data must never land on the container's own rootfs.

- name: Install Apache, MariaDB, Redis and PHP
  ansible.builtin.apt:
    name: "{{ ['apache2', 'mariadb-server', 'python3-pymysql', 'redis-server', 'unzip'] + nextcloud_php_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add www-data to the redis group (unix socket access)
  ansible.builtin.user:
    name: www-data
    groups: redis
    append: true

- name: Enable required Apache modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy_fcgi
    - setenvif
    - rewrite
    - headers
    - env
    - dir
    - mime
  notify: Reload apache2

- name: Deploy PHP-FPM tuning overrides
  ansible.builtin.template:
    src: php-nextcloud.ini.j2
    dest: "/etc/php/{{ nextcloud_php_version }}/fpm/conf.d/99-nextcloud.ini"
    owner: root
    group: root
    mode: "0644"
  notify: Restart php-fpm

- name: Deploy Nextcloud Apache vhost
  ansible.builtin.template:
    src: nextcloud-vhost.conf.j2
    dest: /etc/apache2/sites-available/nextcloud.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload apache2

- name: Disable the default Apache site
  ansible.builtin.command: a2dissite 000-default
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Reload apache2

- name: Enable the Nextcloud Apache site
  ansible.builtin.command: a2ensite nextcloud
  args:
    creates: /etc/apache2/sites-enabled/nextcloud.conf
  notify: Reload apache2

- name: Ensure MariaDB, Redis, Apache and PHP-FPM are running and enabled
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - mariadb
    - redis-server
    - "php{{ nextcloud_php_version }}-fpm"
    - apache2

- name: Set the MariaDB root password
  community.mysql.mysql_user:
    name: root
    password: "{{ vault_mysql_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
    check_implicit_admin: true
    state: present

- name: Create the Nextcloud database
  community.mysql.mysql_db:
    name: "{{ nextcloud_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_general_ci
    login_user: root
    login_password: "{{ vault_mysql_root_password }}"
    state: present

- name: Create the Nextcloud database user
  community.mysql.mysql_user:
    name: "{{ nextcloud_db_user }}"
    password: "{{ vault_nextcloud_db_password }}"
    priv: "{{ nextcloud_db_name }}.*:ALL"
    login_user: root
    login_password: "{{ vault_mysql_root_password }}"
    state: present

- name: Check whether Nextcloud is already unpacked
  ansible.builtin.stat:
    path: "{{ nextcloud_install_dir }}/version.php"
  register: nextcloud_version_file

- name: Download and install Nextcloud
  when: not nextcloud_version_file.stat.exists
  block:
    - name: Download the Nextcloud release tarball
      ansible.builtin.get_url:
        url: "{{ nextcloud_download_url }}"
        dest: "/tmp/nextcloud-{{ nextcloud_version }}.tar.bz2"
        mode: "0644"

    - name: Unpack Nextcloud to /var/www
      ansible.builtin.unarchive:
        src: "/tmp/nextcloud-{{ nextcloud_version }}.tar.bz2"
        dest: /var/www
        remote_src: true
        creates: "{{ nextcloud_install_dir }}/version.php"
        owner: www-data
        group: www-data

    - name: Own the Nextcloud install directory
      ansible.builtin.file:
        path: "{{ nextcloud_install_dir }}"
        owner: www-data
        group: www-data
        recurse: true
        state: directory

- name: Check whether Nextcloud is already installed
  ansible.builtin.command: >-
    php occ status --output=json
  args:
    chdir: "{{ nextcloud_install_dir }}"
  become: true
  become_user: www-data
  register: nextcloud_status
  changed_when: false
  failed_when: false

- name: Run first-time Nextcloud install
  ansible.builtin.command: >-
    php occ maintenance:install
    --database mysql
    --database-name {{ nextcloud_db_name }}
    --database-user {{ nextcloud_db_user }}
    --database-pass {{ vault_nextcloud_db_password }}
    --admin-user {{ nextcloud_admin_user }}
    --admin-pass {{ vault_nextcloud_admin_password }}
    --data-dir {{ nextcloud_data_mount }}
  args:
    chdir: "{{ nextcloud_install_dir }}"
  become: true
  become_user: www-data
  when: "'\"installed\":true' not in nextcloud_status.stdout"
  changed_when: true

- name: Set the trusted domain
  ansible.builtin.command: >-
    php occ config:system:set trusted_domains 1 --value={{ nextcloud_domain }}
  args:
    chdir: "{{ nextcloud_install_dir }}"
  become: true
  become_user: www-data
  changed_when: true

- name: Set the CLI/cron URL
  ansible.builtin.command: >-
    php occ config:system:set overwrite.cli.url --value=https://{{ nextcloud_domain }}
  args:
    chdir: "{{ nextcloud_install_dir }}"
  become: true
  become_user: www-data
  changed_when: true

- name: Trust the reverse proxy and its forwarded protocol
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ nextcloud_install_dir }}"
  become: true
  become_user: www-data
  changed_when: true
  loop:
    - "php occ config:system:set trusted_proxies 0 --value={{ nextcloud_trusted_proxy_ip }}"
    - "php occ config:system:set overwriteprotocol --value=https"

- name: Configure Redis for distributed caching and file locking
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ nextcloud_install_dir }}"
  become: true
  become_user: www-data
  changed_when: true
  loop:
    - "php occ config:system:set memcache.local --value='\\OC\\Memcache\\APCu'"
    - "php occ config:system:set memcache.locking --value='\\OC\\Memcache\\Redis'"
    - "php occ config:system:set redis host --value=/run/redis/redis-server.sock"
    - "php occ config:system:set redis port --value=0 --type=integer"

- name: Set background jobs to run via cron
  ansible.builtin.command: php occ background:cron
  args:
    chdir: "{{ nextcloud_install_dir }}"
  become: true
  become_user: www-data
  changed_when: true

- name: Install the Nextcloud cron job
  ansible.builtin.cron:
    name: nextcloud background jobs
    user: www-data
    minute: "*/5"
    job: "php -f {{ nextcloud_install_dir }}/cron.php"
