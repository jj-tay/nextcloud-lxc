---
# 1:1 UID/GID carve-out for www-data in the unprivileged LXC.
#
# The Proxmox host mounts the NFS export (host_nfs.yml), so TrueNAS files
# owned by nextcloud_www_data_uid:gid (mapall) show up on the host with
# those same IDs. With the default unprivileged mapping (container N -> host
# 100000+N) those IDs aren't mapped into the container at all, so they'd
# appear as nobody:nogroup. Mapping exactly that one UID and one GID 1:1
# makes them www-data inside the container; every other ID keeps the
# default shifted mapping.
#
# The lxc.idmap lines are written into the main section of
# /etc/pve/lxc/<vmid>.conf (Proxmox has no `pct set` option for raw lxc.*
# keys) and only when missing. Existing, different idmap lines are never
# overwritten: the play fails instead. Applying the map needs the container
# stopped, and files the container already owns as www-data (host
# 100000+uid / 100000+gid) are re-owned to the 1:1 IDs first, or they would
# turn into nobody:nogroup under the new map.

- name: Build the desired idmap for LXC {{ nextcloud_lxc_vmid }}
  ansible.builtin.set_fact:
    nextcloud_idmap_desired:
      - "lxc.idmap: u 0 {{ nextcloud_lxc_idmap_base }} {{ nextcloud_www_data_uid }}"
      - "lxc.idmap: u {{ nextcloud_www_data_uid }} {{ nextcloud_www_data_uid }} 1"
      - "lxc.idmap: u {{ nextcloud_www_data_uid + 1 }} {{ nextcloud_lxc_idmap_base + nextcloud_www_data_uid + 1 }} {{ 65535 - nextcloud_www_data_uid }}"
      - "lxc.idmap: g 0 {{ nextcloud_lxc_idmap_base }} {{ nextcloud_www_data_gid }}"
      - "lxc.idmap: g {{ nextcloud_www_data_gid }} {{ nextcloud_www_data_gid }} 1"
      - "lxc.idmap: g {{ nextcloud_www_data_gid + 1 }} {{ nextcloud_lxc_idmap_base + nextcloud_www_data_gid + 1 }} {{ 65535 - nextcloud_www_data_gid }}"

# Lets root on the host hand these host IDs to a container (lxc checks
# /etc/subuid and /etc/subgid before applying an idmap).
- name: Allow root to map the www-data UID/GID 1:1 into containers
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    line: "root:{{ item.id }}:1"
  delegate_to: "{{ groups['proxmox'][0] }}"
  loop:
    - { path: /etc/subuid, id: "{{ nextcloud_www_data_uid }}" }
    - { path: /etc/subgid, id: "{{ nextcloud_www_data_gid }}" }

- name: Read the LXC's Proxmox config file
  ansible.builtin.slurp:
    src: /etc/pve/lxc/{{ nextcloud_lxc_vmid }}.conf
  delegate_to: "{{ groups['proxmox'][0] }}"
  register: nextcloud_lxc_conf

# Only the main section counts: snapshot sections ([name]) follow it.
- name: Parse the idmap in the main section of the LXC config
  ansible.builtin.set_fact:
    nextcloud_idmap_current: >-
      {{ nextcloud_lxc_conf.content | b64decode
         | regex_replace('(?s)\n\[.*$', '')
         | split('\n') | select('match', '^lxc\.idmap:') | list }}

- name: Fail loudly if the LXC already has a different idmap
  ansible.builtin.assert:
    that:
      - nextcloud_idmap_current in [[], nextcloud_idmap_desired]
    fail_msg: >-
      LXC {{ nextcloud_lxc_vmid }} already has lxc.idmap lines that differ
      from the www-data 1:1 carve-out (found: {{ nextcloud_idmap_current }};
      wanted: {{ nextcloud_idmap_desired }}). Refusing to overwrite them —
      reconcile /etc/pve/lxc/{{ nextcloud_lxc_vmid }}.conf by hand.

- name: Apply the idmap (stop, re-own www-data files, write config, start)
  when: nextcloud_idmap_current | length == 0
  block:
    - name: Shut down the LXC to change its idmap
      ansible.builtin.command: pct shutdown {{ nextcloud_lxc_vmid }} --timeout 120 --forceStop 1
      delegate_to: "{{ groups['proxmox'][0] }}"
      changed_when: true

    - name: Re-own the LXC's www-data files to the 1:1 IDs
      delegate_to: "{{ groups['proxmox'][0] }}"
      block:
        - name: Mount the LXC's rootfs on the Proxmox host
          ansible.builtin.command: pct mount {{ nextcloud_lxc_vmid }}
          register: nextcloud_pct_mount
          changed_when: true

        # -xdev: rootfs only, never the NFS bind mount (TrueNAS owns that).
        - name: Re-own www-data's files from the shifted host UID to the 1:1 UID
          ansible.builtin.command: >-
            find /var/lib/lxc/{{ nextcloud_lxc_vmid }}/rootfs -xdev
            -uid {{ nextcloud_lxc_idmap_base + nextcloud_www_data_uid }}
            -exec chown -h {{ nextcloud_www_data_uid }} {} +
          changed_when: true

        - name: Re-group www-data's files from the shifted host GID to the 1:1 GID
          ansible.builtin.command: >-
            find /var/lib/lxc/{{ nextcloud_lxc_vmid }}/rootfs -xdev
            -gid {{ nextcloud_lxc_idmap_base + nextcloud_www_data_gid }}
            -exec chgrp -h {{ nextcloud_www_data_gid }} {} +
          changed_when: true
      always:
        - name: Unmount the LXC's rootfs
          ansible.builtin.command: pct unmount {{ nextcloud_lxc_vmid }}
          changed_when: true
          when: nextcloud_pct_mount is succeeded

    # Re-read: `pct mount`/`unmount` touch the config (lock), so write the
    # idmap into what is there now. Written last, so a failure above leaves
    # the idmap missing and the next run redoes the whole step.
    - name: Re-read the LXC's Proxmox config file
      ansible.builtin.slurp:
        src: /etc/pve/lxc/{{ nextcloud_lxc_vmid }}.conf
      delegate_to: "{{ groups['proxmox'][0] }}"
      register: nextcloud_lxc_conf_stopped

    # No mode/owner: pmxcfs fixes those itself for files under /etc/pve.
    - name: Write the idmap into the main section of the LXC config  # noqa: risky-file-permissions
      ansible.builtin.copy:
        dest: /etc/pve/lxc/{{ nextcloud_lxc_vmid }}.conf
        content: "{{ nextcloud_conf_main | trim }}\n{{ nextcloud_idmap_desired | join('\n') }}\n{{ nextcloud_conf_snapshots }}"
        # /etc/pve is pmxcfs, which refuses some of the ownership calls
        # Ansible makes around its atomic rename.
        unsafe_writes: true
      delegate_to: "{{ groups['proxmox'][0] }}"
      vars:
        nextcloud_conf_text: "{{ nextcloud_lxc_conf_stopped.content | b64decode }}"
        nextcloud_conf_main: "{{ nextcloud_conf_text | regex_replace('(?s)\\n\\[.*$', '') }}"
        nextcloud_conf_snapshots: "{{ nextcloud_conf_text | regex_search('(?s)\\n\\[.*$') | default('', true) }}"

    - name: Start the LXC with the new idmap
      ansible.builtin.command: pct start {{ nextcloud_lxc_vmid }}
      delegate_to: "{{ groups['proxmox'][0] }}"
      changed_when: true

    - name: Wait for the LXC to come back after the idmap change
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
