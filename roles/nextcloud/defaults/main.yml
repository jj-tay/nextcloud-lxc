---
# Non-secret configuration. Secrets live in group_vars/all/vault.yml.

# Shared with the proxmox_lxc role, so defined in group_vars/all/main.yml
# instead: nextcloud_lxc_vmid, nextcloud_lxc_host, nextcloud_vmbr1_netif,
# nextcloud_vmbr1_bridge, nextcloud_vmbr1_ip.

# --- Environment placeholders (fill in per environment) ---
nextcloud_domain: nextcloud.home.blueyak.net

# --- Data directory: TrueNAS NFS -> Proxmox host -> bind mount into the LXC ---
# NFS cannot be mounted inside an unprivileged LXC (NFS has no user
# namespace support, so mount(2) fails with EPERM whatever the AppArmor
# profile or feature flags). The Proxmox HOST mounts the export instead
# (tasks/host_nfs.yml), and that path is bind-mounted into the container as a
# Proxmox mount point.
#
# Container-side path: where Nextcloud actually sees its data (the bind
# mount target, and occ's --data-dir).
nextcloud_data_mount: /mnt/ncdata
# Host-side NFS mount point: where the Proxmox host mounts
# truenas_nfs_host:truenas_nfs_export (persisted in the host's /etc/fstab).
# Never referenced inside the container.
nextcloud_host_nfs_mount: /mnt/nextcloud-data
# NFS mount options on the host. _netdev: at boot, delay the mount until the
# network (incl. vmbr1) is up.
nextcloud_host_nfs_opts: "rw,soft,noatime,_netdev"
# Proxmox mount point key (mpN) that bind-mounts nextcloud_host_nfs_mount to
# nextcloud_data_mount in the LXC.
nextcloud_data_mp: mp0
# The Proxmox host's own static IP on vmbr1 (on the bridge itself, no
# gateway), so the host can reach TrueNAS over the isolated storage link.
# Not the LXC's vmbr1 IP (nextcloud_vmbr1_ip) or TrueNAS's (truenas_nfs_host).
proxmox_host_vmbr1_ip: 10.10.10.1/24

# truenas_nfs_host: must be the TrueNAS VM's vmbr1 address, NOT its LAN IP —
# NFS traffic has to ride the isolated vmbr1 link.
truenas_nfs_host: 10.10.10.10
truenas_nfs_export: /mnt/tank/nextcloud
# www-data's UID and GID inside the LXC. These must match the TrueNAS NFS
# export's Mapall User UID and Mapall Group GID exactly (currently
# nextcloud-nfs:1000 and nextcloud-nfs:3000 on the TrueNAS side — TrueNAS
# auto-created the group at 3000, so UID and GID deliberately differ).
# A mismatch causes file permission errors on the NFS-mounted data directory.
nextcloud_www_data_uid: 1000
nextcloud_www_data_gid: 3000
proxmox_host: 192.168.10.50

# --- Reverse proxy (Nginx Proxy Manager terminates TLS in front of this LXC) ---
nextcloud_trusted_proxy_ip: 192.168.10.59

# --- Nextcloud release ---
# Full point release; overridden with -e nextcloud_version=x.y.z for upgrades.
nextcloud_version: 34.0.0
nextcloud_download_url: "https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.tar.bz2"
nextcloud_install_dir: /var/www/nextcloud

# --- PHP ---
# Debian 13's default PHP (no third-party repo needed).
nextcloud_php_version: "8.4"
nextcloud_php_packages:
  - "php{{ nextcloud_php_version }}"
  - "php{{ nextcloud_php_version }}-fpm"
  - "php{{ nextcloud_php_version }}-gd"
  - "php{{ nextcloud_php_version }}-mysql"
  - "php{{ nextcloud_php_version }}-curl"
  - "php{{ nextcloud_php_version }}-mbstring"
  - "php{{ nextcloud_php_version }}-intl"
  - "php{{ nextcloud_php_version }}-bcmath"
  - "php{{ nextcloud_php_version }}-gmp"
  - "php{{ nextcloud_php_version }}-xml"
  - "php{{ nextcloud_php_version }}-zip"
  - "php{{ nextcloud_php_version }}-apcu"
  - "php{{ nextcloud_php_version }}-redis"

nextcloud_php_memory_limit: 512M
nextcloud_php_upload_max_filesize: 16G
nextcloud_php_post_max_size: 16G
nextcloud_php_max_execution_time: 3600

# --- Database ---
nextcloud_db_name: nextcloud
nextcloud_db_user: nextcloud

# --- Admin account ---
nextcloud_admin_user: admin

# --- Apache ---
nextcloud_apache_port: 80
