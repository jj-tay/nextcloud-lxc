---
# Non-secret configuration. Secrets live in group_vars/all/vault.yml.

# --- Environment placeholders (fill in per environment) ---
# nextcloud_lxc_host: assign this as a UniFi Fixed IP (DHCP reservation) for
# the LXC's MAC address before the first run.
nextcloud_lxc_host: 192.168.10.51
nextcloud_domain: nextcloud.home.blueyak.net
nextcloud_data_mount: /mnt/ncdata
truenas_nfs_host: 192.168.10.123
truenas_nfs_export: /mnt/tank/nextcloud
# Must match the TrueNAS NFS export's Mapall User/Group UID/GID (create a
# dedicated UID-1000 user, e.g. "ncdata", on TrueNAS and set it as Mapall).
nextcloud_www_data_uid: 1000
proxmox_host: 192.168.10.50
nextcloud_lxc_vmid: 104

# --- Reverse proxy (Nginx Proxy Manager terminates TLS in front of this LXC) ---
nextcloud_trusted_proxy_ip: 192.168.10.59

# --- Nextcloud release ---
# Full point release; overridden with -e nextcloud_version=x.y.z for upgrades.
nextcloud_version: 34.0.0
nextcloud_download_url: "https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.tar.bz2"
nextcloud_install_dir: /var/www/nextcloud

# --- PHP ---
nextcloud_php_version: "8.2"
nextcloud_php_packages:
  - "php{{ nextcloud_php_version }}"
  - "php{{ nextcloud_php_version }}-fpm"
  - "php{{ nextcloud_php_version }}-gd"
  - "php{{ nextcloud_php_version }}-mysql"
  - "php{{ nextcloud_php_version }}-curl"
  - "php{{ nextcloud_php_version }}-mbstring"
  - "php{{ nextcloud_php_version }}-intl"
  - "php{{ nextcloud_php_version }}-bcmath"
  - "php{{ nextcloud_php_version }}-gmp"
  - "php{{ nextcloud_php_version }}-xml"
  - "php{{ nextcloud_php_version }}-zip"
  - "php{{ nextcloud_php_version }}-apcu"
  - "php{{ nextcloud_php_version }}-redis"

nextcloud_php_memory_limit: 512M
nextcloud_php_upload_max_filesize: 16G
nextcloud_php_post_max_size: 16G
nextcloud_php_max_execution_time: 3600

# --- Database ---
nextcloud_db_name: nextcloud
nextcloud_db_user: nextcloud

# --- Admin account ---
nextcloud_admin_user: admin

# --- Apache ---
nextcloud_apache_port: 80
