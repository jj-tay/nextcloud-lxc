# Proxmox API endpoint for the provisioning play. The play runs on the
# Ansible controller itself (the API host/credentials come from vault.yml),
# using the Python that runs Ansible, so proxmoxer must be installed there.
[proxmox_api]
proxmox-api ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"

# Proxmox host over SSH, for the `pct` calls in the nextcloud role
# (tasks/network.yml on install, `pct snapshot` in tasks/upgrade.yml).
[proxmox]
proxmox-host ansible_host=192.168.10.50

# Install runs replace ansible_host with the IP the Proxmox API reports
# (add_host in roles/proxmox_lxc). Upgrade runs (--tags upgrade) skip
# provisioning and use this value, so keep it equal to nextcloud_lxc_host.
[nextcloud_lxc]
nextcloud-lxc ansible_host=192.168.10.51

[nextcloud_lxc:vars]
ansible_user=root

[proxmox:vars]
ansible_user=root
